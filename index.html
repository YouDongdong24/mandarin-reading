<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汉语朗读练习</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1d2939;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #2563eb;
      --danger: #b42318;
      --success: #067647;
      --warning: #b54708;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      width: min(760px, calc(100% - 32px));
      margin: 32px auto 64px;
    }

    .brand {
      margin: 0 0 14px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
    }

    .subtitle {
      margin: 10px 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .card {
      margin-top: 16px;
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
    }

    .target {
      margin: 8px 0 0;
      font-size: clamp(28px, 6vw, 46px);
      line-height: 1.5;
      font-family: "Noto Serif SC", "Songti SC", SimSun, serif;
      word-break: break-word;
    }

    .pinyin {
      margin: 14px 0 0;
      color: var(--primary);
      font-size: 18px;
      line-height: 1.6;
    }

    .russian {
      margin: 12px 0 0;
      padding: 12px;
      color: #344054;
      background: #f8fafc;
      border-left: 4px solid #94a3b8;
      border-radius: 8px;
      line-height: 1.6;
    }

    .instructions {
      margin: 12px 0 0;
      color: #475467;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgba(37, 99, 235, .15);
      border-color: var(--primary);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button, .download-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .primary { color: #fff; background: var(--primary); }
    .secondary { color: #344054; background: #eef2f6; }
    .danger { color: #fff; background: var(--danger); }

    .hidden { display: none !important; }

    .status {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .info { color: #1d4ed8; background: #eff6ff; }
    .success { color: var(--success); background: #ecfdf3; }
    .warning { color: var(--warning); background: #fffaeb; }
    .error { color: var(--danger); background: #fef3f2; }

    .recording {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: var(--danger);
      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f04438;
    }

    audio {
      width: 100%;
      margin-top: 16px;
    }

    .small {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 760px);
        margin-top: 18px;
      }

      .card { padding: 18px; }

      .buttons > * { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="brand">Mandarin Reading Practice</p>
    <h1 id="pageTitle">正在载入朗读任务…</h1>
    <p class="subtitle">请清楚、自然地朗读指定内容。</p>

    <section id="taskCard" class="card hidden">
      <span class="label">请朗读</span>
      <p id="targetText" class="target"></p>
      <p id="pinyin" class="pinyin hidden"></p>
      <p id="russianHint" class="russian hidden"></p>
      <p id="instructions" class="instructions hidden"></p>
    </section>

    <section id="studentCard" class="card hidden">
      <label class="label" for="studentName">你的姓名或学号</label>
      <input
        id="studentName"
        type="text"
        maxlength="80"
        placeholder="例如：Ivan Petrov / A2-03"
      >
      <p class="small">请输入老师可识别的姓名或学号。</p>
    </section>

    <section id="recordCard" class="card hidden">
      <span class="label">录音</span>

      <div class="buttons">
        <button id="startButton" class="primary" type="button">开始录音</button>
        <button id="stopButton" class="danger hidden" type="button">停止录音</button>
        <button id="resetButton" class="secondary hidden" type="button">删除并重新录制</button>
      </div>

      <div id="recordingIndicator" class="recording hidden">
        <span class="dot"></span>
        <span id="recordingTime">正在录音：00:00</span>
      </div>

      <audio id="audioPreview" class="hidden" controls></audio>

      <div id="audioActions" class="buttons hidden">
        <button id="submitButton" class="primary" type="button">提交录音</button>
        <a id="downloadLink" class="download-link secondary" download="mandarin-reading.webm">下载录音备份</a>
      </div>

      <p id="recordStatus" class="status info">
        点击“开始录音”，浏览器会请求麦克风权限。
      </p>
    </section>

    <section id="errorCard" class="card hidden">
      <p id="pageError" class="status error"></p>
    </section>
  </main>

  <script>
    const API_BASE = "https://你的Worker地址";

    const taskId = getTaskIdFromUrl();

    const state = {
      task: null,
      stream: null,
      recorder: null,
      chunks: [],
      audioBlob: null,
      audioUrl: null,
      timerId: null,
      startedAt: null,
      maxSeconds: 60
    };

    const els = {
      pageTitle: document.getElementById("pageTitle"),
      taskCard: document.getElementById("taskCard"),
      studentCard: document.getElementById("studentCard"),
      recordCard: document.getElementById("recordCard"),
      errorCard: document.getElementById("errorCard"),
      pageError: document.getElementById("pageError"),
      targetText: document.getElementById("targetText"),
      pinyin: document.getElementById("pinyin"),
      russianHint: document.getElementById("russianHint"),
      instructions: document.getElementById("instructions"),
      studentName: document.getElementById("studentName"),
      startButton: document.getElementById("startButton"),
      stopButton: document.getElementById("stopButton"),
      resetButton: document.getElementById("resetButton"),
      recordingIndicator: document.getElementById("recordingIndicator"),
      recordingTime: document.getElementById("recordingTime"),
      audioPreview: document.getElementById("audioPreview"),
      audioActions: document.getElementById("audioActions"),
      submitButton: document.getElementById("submitButton"),
      downloadLink: document.getElementById("downloadLink"),
      recordStatus: document.getElementById("recordStatus")
    };

    init();

    async function init() {
      if (!taskId) {
        showPageError("链接不完整：未找到朗读任务编号。请向老师重新索取链接。");
        return;
      }

      if (!API_BASE.startsWith("https://")) {
        showPageError("网页尚未配置后端地址。请联系老师。");
        return;
      }

      try {
        const url = `${API_BASE.replace(/\/$/, "")}/api/tasks/${encodeURIComponent(taskId)}`;
        const response = await fetch(url, { cache: "no-store" });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || `无法读取朗读任务（HTTP ${response.status}）。`);
        }

        state.task = data.task;
        renderTask(data.task);
      } catch (error) {
        showPageError(`无法加载任务：${error.message || String(error)}`);
      }
    }

    function renderTask(task) {
      document.title = `${task.title} · 汉语朗读练习`;
      els.pageTitle.textContent = task.title;
      els.targetText.textContent = task.target_text;

      showOptionalText(els.pinyin, task.pinyin);
      showOptionalText(els.russianHint, task.russian_hint);
      showOptionalText(els.instructions, task.instructions);

      els.taskCard.classList.remove("hidden");
      els.studentCard.classList.remove("hidden");
      els.recordCard.classList.remove("hidden");

      els.startButton.addEventListener("click", startRecording);
      els.stopButton.addEventListener("click", stopRecording);
      els.resetButton.addEventListener("click", () => resetRecording(true));
      els.submitButton.addEventListener("click", submitRecording);
    }

    function showOptionalText(element, value) {
      if (value && String(value).trim()) {
        element.textContent = value;
        element.classList.remove("hidden");
      }
    }

    async function startRecording() {
      if (!els.studentName.value.trim()) {
        setStatus("请先填写姓名或学号。", "warning");
        els.studentName.focus();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        setStatus("当前浏览器不支持录音。请使用新版 Chrome、Edge、Safari 或 Firefox。", "error");
        return;
      }

      try {
        resetRecording(false);

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const mimeType = chooseMimeType();
        const recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        state.stream = stream;
        state.recorder = recorder;
        state.chunks = [];
        state.startedAt = Date.now();

        recorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) {
            state.chunks.push(event.data);
          }
        });

        recorder.addEventListener("stop", onRecordingStopped);
        recorder.start(250);

        els.startButton.classList.add("hidden");
        els.stopButton.classList.remove("hidden");
        els.resetButton.classList.add("hidden");
        els.recordingIndicator.classList.remove("hidden");
        setStatus(`正在录音，最长 ${state.maxSeconds} 秒。`, "info");

        startTimer();
      } catch (error) {
        setStatus(micErrorText(error), "error");
      }
    }

    function stopRecording() {
      if (state.recorder && state.recorder.state === "recording") {
        state.recorder.stop();
      }
    }

    function onRecordingStopped() {
      stopTimer();
      stopTracks();

      const mimeType = state.recorder ? state.recorder.mimeType : "audio/webm";
      const blob = new Blob(state.chunks, { type: mimeType });

      state.recorder = null;
      state.chunks = [];

      if (blob.size === 0) {
        setStatus("没有录到声音，请检查麦克风后重试。", "error");
        return;
      }

      state.audioBlob = blob;
      state.audioUrl = URL.createObjectURL(blob);

      els.audioPreview.src = state.audioUrl;
      els.audioPreview.classList.remove("hidden");
      els.downloadLink.href = state.audioUrl;
      els.downloadLink.download = `mandarin-reading-${safeFileName(els.studentName.value)}.${extensionForMimeType(blob.type)}`;
      els.audioActions.classList.remove("hidden");

      els.recordingIndicator.classList.add("hidden");
      els.stopButton.classList.add("hidden");
      els.startButton.classList.remove("hidden");
      els.resetButton.classList.remove("hidden");

      setStatus("录音已完成。请先试听，确认后点击“提交录音”。", "success");
    }

    async function submitRecording() {
      if (!state.audioBlob) {
        setStatus("请先完成录音。", "warning");
        return;
      }

      if (!state.task) {
        setStatus("任务信息未准备好，请刷新页面后重试。", "error");
        return;
      }

      const studentName = els.studentName.value.trim();

      if (!studentName) {
        setStatus("请填写姓名或学号。", "warning");
        return;
      }

      els.submitButton.disabled = true;
      setStatus("正在提交录音，请不要关闭页面。", "info");

      try {
        const extension = extensionForMimeType(state.audioBlob.type);
        const audioFile = new File(
          [state.audioBlob],
          `mandarin-reading.${extension}`,
          { type: state.audioBlob.type || "audio/webm" }
        );

        const formData = new FormData();
        formData.append("task_id", state.task.public_id);
        formData.append("student_name", studentName);
        formData.append("audio", audioFile);

        const response = await fetch(`${API_BASE.replace(/\/$/, "")}/api/submissions`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "提交失败。");
        }

        setStatus(data.message || "录音提交成功。", "success");
        els.submitButton.textContent = "已提交";
      } catch (error) {
        setStatus(`提交失败：${error.message || String(error)}`, "error");
        els.submitButton.disabled = false;
      }
    }

    function resetRecording(showMessage) {
      stopTimer();

      if (state.recorder && state.recorder.state === "recording") {
        state.recorder.stop();
      }

      stopTracks();

      if (state.audioUrl) {
        URL.revokeObjectURL(state.audioUrl);
      }

      state.recorder = null;
      state.chunks = [];
      state.audioBlob = null;
      state.audioUrl = null;
      state.startedAt = null;

      els.audioPreview.pause();
      els.audioPreview.removeAttribute("src");
      els.audioPreview.load();
      els.audioPreview.classList.add("hidden");
      els.audioActions.classList.add("hidden");
      els.recordingIndicator.classList.add("hidden");
      els.stopButton.classList.add("hidden");
      els.startButton.classList.remove("hidden");
      els.resetButton.classList.add("hidden");

      if (showMessage) {
        setStatus("录音已删除。你可以重新录制。", "info");
      }
    }

    function stopTracks() {
      if (state.stream) {
        state.stream.getTracks().forEach((track) => track.stop());
      }
      state.stream = null;
    }

    function startTimer() {
      updateTimer();

      state.timerId = window.setInterval(() => {
        const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);

        if (elapsed >= state.maxSeconds) {
          stopRecording();
          return;
        }

        updateTimer();
      }, 250);
    }

    function stopTimer() {
      if (state.timerId) {
        window.clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function updateTimer() {
      const elapsed = state.startedAt
        ? Math.floor((Date.now() - state.startedAt) / 1000)
        : 0;

      els.recordingTime.textContent =
        `正在录音：${formatSeconds(elapsed)} / ${formatSeconds(state.maxSeconds)}`;
    }

    function chooseMimeType() {
      const types = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus",
        "audio/ogg"
      ];

      return types.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function extensionForMimeType(mimeType) {
      const type = (mimeType || "").toLowerCase();

      if (type.includes("ogg")) return "ogg";
      if (type.includes("mp4")) return "m4a";
      if (type.includes("mpeg")) return "mp3";
      if (type.includes("wav")) return "wav";
      return "webm";
    }

    function setStatus(message, type) {
      els.recordStatus.textContent = message;
      els.recordStatus.className = `status ${type}`;
    }

    function showPageError(message) {
      els.pageTitle.textContent = "无法打开朗读任务";
      els.pageError.textContent = message;
      els.errorCard.classList.remove("hidden");
    }

    function getTaskIdFromUrl() {
      const hash = window.location.hash.replace(/^#\/?/, "");
      const parts = hash.split("/").filter(Boolean);

      return parts[0] === "task" && parts[1] ? parts[1] : "";
    }

    function formatSeconds(total) {
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function safeFileName(value) {
      return (value || "student")
        .trim()
        .replace(/[^\p{L}\p{N}_-]+/gu, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 40) || "student";
    }

    function micErrorText(error) {
      if (error && error.name === "NotAllowedError") {
        return "浏览器未获得麦克风权限。请在地址栏允许麦克风后刷新页面。";
      }

      if (error && error.name === "NotFoundError") {
        return "未检测到可用麦克风。请检查电脑或手机的麦克风设置。";
      }

      return `无法开始录音：${error && error.message ? error.message : "未知错误"}`;
    }
  </script>
</body>
</html>
